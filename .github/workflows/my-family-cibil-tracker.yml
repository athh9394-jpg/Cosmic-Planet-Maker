name: Build My Family CIBIL Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyFamilyCibilTracker/**'
      - '.github/workflows/my-family-cibil-tracker.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p MyFamilyCibilTracker assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-family-cibil-tracker-debug-apk
          path: MyFamilyCibilTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
