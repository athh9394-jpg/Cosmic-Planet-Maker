name: Build Cosmic Planet Maker APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'CosmicPlanetMaker_Android_Project.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true
      - name: Extract Android project
        run: |
          test -f CosmicPlanetMaker_Android_Project.zip
          mkdir project
          unzip -q CosmicPlanetMaker_Android_Project.zip -d project
          cp -R project/CosmicPlanetMaker/. .
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-planet-maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
